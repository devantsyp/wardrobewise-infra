---
- name: Deploy application
  hosts: ec2
  become: true

  vars:
    # Set `domain` in inventory/hosts.ini to turn on HTTPS; leave empty for HTTP-only.
    https_enabled: "{{ (domain | default('')) | length > 0 }}"
    nginx_conf: /etc/nginx/conf.d/laundry_advisor.conf

  tasks:
    - name: Write .env.prod
      copy:
        dest: /home/ec2-user/app/.env.prod
        mode: '0600'
        owner: ec2-user
        content: |
          DJANGO_SETTINGS_MODULE=laundry_advisor.settings.prod
          SECRET_KEY={{ secret_key | replace('$', '$$') }}
          EC2_HOST={{ inventory_hostname }}
          DOMAIN={{ domain | default('') }}
          DATABASE_URL=postgres://postgres:{{ postgres_password | replace('$', '$$') }}@db:5432/laundry_advisor
          POSTGRES_DB=laundry_advisor
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD={{ postgres_password | replace('$', '$$') }}
          AWS_STORAGE_BUCKET_NAME={{ aws_bucket }}
          AWS_ACCESS_KEY_ID={{ aws_access_key_id | replace('$', '$$') }}
          AWS_SECRET_ACCESS_KEY={{ aws_secret_access_key | replace('$', '$$') }}
          OPENAI_API_KEY={{ openai_api_key | replace('$', '$$') }}

    - name: Copy docker-compose.prod.yml
      copy:
        src: ../../docker-compose.prod.yml
        dest: /home/ec2-user/app/docker-compose.prod.yml
        owner: ec2-user

    - name: Log in to ECR
      shell: >
        aws ecr get-login-password --region us-east-1 |
        docker login --username AWS --password-stdin {{ ecr_registry }}

    - name: Pull latest image
      command: docker pull {{ ecr_registry }}/laundryadvisor:{{ image_tag | default('latest') }}

    - name: Start application
      command: docker compose -f /home/ec2-user/app/docker-compose.prod.yml up -d
      environment:
        ECR_IMAGE: "{{ ecr_registry }}/laundryadvisor:{{ image_tag | default('latest') }}"

    # ---------------------------------------------------------------- disk hygiene
    # Each deploy pulls a new ~500 MB `latest` image and leaves the previous one
    # behind untagged; on the 8 GB root disk these filled ~2.5 GB. Images in use
    # by running containers are never removed, and every version stays in ECR.

    - name: Remove old (dangling) Docker images
      command: docker image prune -f
      register: prune
      changed_when: "'Total reclaimed space: 0B' not in prune.stdout"

    - name: Create journald drop-in directory
      file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: '0755'

    - name: Cap systemd journal size
      copy:
        dest: /etc/systemd/journald.conf.d/size.conf
        content: |
          [Journal]
          SystemMaxUse=200M
      register: journald_conf

    - name: Apply journal size cap
      systemd:
        name: systemd-journald
        state: restarted
      when: journald_conf.changed

    # ---------------------------------------------------------------- backups
    # Nightly pg_dump to a private S3 bucket. Set `backup_bucket` in
    # inventory/hosts.ini to enable; the EC2 instance role needs s3:PutObject on it.

    - name: Set up nightly database backups to S3
      when: (backup_bucket | default('')) | length > 0
      block:
        - name: Install backup script
          template:
            src: ../templates/pg-backup.sh.j2
            dest: /usr/local/bin/pg-backup
            mode: '0755'

        - name: Install backup service
          copy:
            dest: /etc/systemd/system/pg-backup.service
            content: |
              [Unit]
              Description=Back up PostgreSQL to S3
              Requires=docker.service
              After=docker.service

              [Service]
              Type=oneshot
              ExecStart=/usr/local/bin/pg-backup

        - name: Install backup timer
          copy:
            dest: /etc/systemd/system/pg-backup.timer
            content: |
              [Unit]
              Description=Nightly PostgreSQL backup

              [Timer]
              OnCalendar=*-*-* 04:00:00 UTC
              RandomizedDelaySec=15m
              Persistent=true

              [Install]
              WantedBy=timers.target

        - name: Enable backup timer
          systemd:
            name: pg-backup.timer
            state: started
            enabled: true
            daemon_reload: true

    # ---------------------------------------------------------------- nginx / TLS

    - name: Create ACME challenge webroot
      file:
        path: /var/www/certbot
        state: directory
        mode: '0755'

    - name: Configure Nginx (HTTP only)
      copy:
        src: ../../nginx/nginx.conf
        dest: "{{ nginx_conf }}"
      when: not (https_enabled | bool)

    - name: Set up HTTPS with Let's Encrypt
      when: https_enabled | bool
      block:
        - name: Install certbot in a virtualenv
          shell: python3 -m venv /opt/certbot && /opt/certbot/bin/pip install --upgrade pip certbot
          args:
            creates: /opt/certbot/bin/certbot

        - name: Check for an existing certificate
          stat:
            path: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"
          register: cert

        - name: Serve the ACME challenge over HTTP for first issuance
          copy:
            src: ../../nginx/nginx.conf
            dest: "{{ nginx_conf }}"
          when: not cert.stat.exists

        - name: Reload Nginx before first issuance
          systemd:
            name: nginx
            state: reloaded
          when: not cert.stat.exists

        - name: Obtain certificate
          command: >
            /opt/certbot/bin/certbot certonly --webroot -w /var/www/certbot
            -d {{ domain }} -d www.{{ domain }}
            --non-interactive --agree-tos --register-unsafely-without-email
          args:
            creates: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"

        - name: Configure Nginx (HTTPS)
          template:
            src: ../../nginx/nginx-https.conf.j2
            dest: "{{ nginx_conf }}"

        - name: Install certbot renewal service
          copy:
            dest: /etc/systemd/system/certbot-renew.service
            content: |
              [Unit]
              Description=Renew Let's Encrypt certificates

              [Service]
              Type=oneshot
              ExecStart=/opt/certbot/bin/certbot renew --quiet --deploy-hook "systemctl reload nginx"

        - name: Install certbot renewal timer
          copy:
            dest: /etc/systemd/system/certbot-renew.timer
            content: |
              [Unit]
              Description=Twice-daily Let's Encrypt renewal check

              [Timer]
              OnCalendar=*-*-* 03,15:00:00
              RandomizedDelaySec=1h
              Persistent=true

              [Install]
              WantedBy=timers.target

        - name: Enable certbot renewal timer
          systemd:
            name: certbot-renew.timer
            state: started
            enabled: true
            daemon_reload: true

    - name: Validate Nginx config
      command: nginx -t
      changed_when: false

    - name: Reload Nginx
      systemd:
        name: nginx
        state: reloaded
